<!DOCTYPE html>
<html lang="en">
<head>
    <title>User Registeration Form</title>
    <script src = "script.js"></script>
</head>
<body>
    <h1>Registertion Form</h1>
    <Form>
        <label for="name">Name :</label>
        <input type="text" id = "name" name = "name" required>
        <br></br>
        <label for="email">Email :</label>
        <input type="email" id = "email" email = "email" required>
        <br></br>
        <label for="phone">Phone Number :</label>
        <input type="number" id = "phone" phone = "phone" required>
        <br></br>
        <button type="submit" onclick="submitForm()">Register</button>
    </Form>
    <p id="confirmation"></p>
</body>
</html>
